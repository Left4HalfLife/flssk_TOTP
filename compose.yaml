services:
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /data/accounts.sqlite3
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - accounts:/data
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health', headers={'Host': os.environ.get('WEBAUTHN_RP_ID','localhost')}), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  redis:
    image: redis:7-alpine
    user: "999:999"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    read_only: true
    tmpfs:
      - /data:uid=999,gid=999,mode=0700
      - /tmp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  accounts:
